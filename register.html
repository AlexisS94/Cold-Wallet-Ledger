<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up — Cold Wallet Ledger</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="auth">
  <div class="auth-card">
    <a class="logo" href="index.html" style="margin-bottom:22px"><span class="logo-mark">CW</span> Cold Wallet Ledger</a>
    <h1>Create account</h1>
    <p class="sub">Open a spot wallet and API console in under a minute.</p>

    <div class="alert alert-err" id="msg"></div>

    <form id="reg-form" novalidate>
      <div class="field"><label for="em">Email</label>
        <input id="em" type="email" placeholder="you@example.com" required></div>
      <div class="field"><label for="us">Username</label>
        <input id="us" type="text" placeholder="Choose a username" required></div>
      <div class="field"><label for="pw">Password</label>
        <input id="pw" type="password" placeholder="Min. 8 characters" required></div>
      <button class="btn btn-primary btn-block btn-lg" type="submit" style="margin-top:6px">Create account</button>
    </form>

    <p class="auth-foot">Already registered? <a href="login.html">Log in</a></p>
  </div>
</div>

<script>
  const f = document.getElementById("reg-form"), m = document.getElementById("msg");
  f.addEventListener("submit", e=>{
    e.preventDefault();
    m.classList.remove("show");
    if(!f.em.value.trim() || !f.us.value.trim() || f.pw.value.length < 8){
      m.textContent = "Please fill every field (password: 8 characters minimum).";
      m.classList.add("show"); return;
    }
    const b = f.querySelector("button");
    b.disabled = true; b.textContent = "Creating…";
    setTimeout(()=>{
      b.textContent = "Account created";
      m.textContent = "Account registered. Activation is pending — you will be notified once your account is approved.";
      m.classList.add("show");
    }, 900);
  });
</script>
</body>
</html>
