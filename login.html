<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in — Cold Wallet Ledger</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="auth">
  <div class="auth-card">
    <a class="logo" href="index.html" style="margin-bottom:22px"><span class="logo-mark">CW</span> Cold Wallet Ledger</a>
    <h1>Welcome back</h1>
    <p class="sub">Log in to access your wallet and API console.</p>

    <div class="alert alert-err" id="err"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="u">Email or username</label>
        <input id="u" name="u" type="text" autocomplete="username" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="p">Password</label>
        <input id="p" name="p" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button class="btn btn-primary btn-block btn-lg" type="submit" style="margin-top:6px">Log in</button>
    </form>

    <p class="auth-foot">No account? <a href="register.html">Sign up</a></p>
  </div>
</div>

<script src="assets/js/auth.js"></script>
<script>
  const form = document.getElementById("login-form");
  const err  = document.getElementById("err");

  function fail(msg){
    err.textContent = msg;
    err.classList.add("show");
  }

  form.addEventListener("submit", e=>{
    e.preventDefault();
    err.classList.remove("show");
    const u = form.u.value.trim();
    const p = form.p.value;

    if(!u || !p) return fail("Enter your username and password.");

    const btn = form.querySelector("button");
    btn.disabled = true; btn.textContent = "Verifying…";

    setTimeout(()=>{
      if(u.toLowerCase() === CREDS.user && p === CREDS.pass){
        login();
        location.href = "app.html";
      } else {
        btn.disabled = false; btn.textContent = "Log in";
        fail("Incorrect username or password. Please try again.");
      }
    }, 700);
  });
</script>
</body>
</html>
